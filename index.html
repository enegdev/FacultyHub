<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Hub - Centro de Ejercicios</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(15, 19, 29, 0.75);
            --item-bg: rgba(22, 28, 42, 0.6);
            --item-hover: rgba(30, 39, 58, 0.85);
            --tp-bg: rgba(18, 22, 33, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-purple: #c084fc;
            --accent-blue: #38bdf8;
            
            --text-main: #94a3b8;
            --text-bright: #f8fafc;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px 90px 16px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Background Lights */
        .ambient-glow-1 {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.08) 50%, rgba(0, 0, 0, 0) 80%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 250px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        /* Container Principal */
        .hub-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 580px;
        }

        .hub-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.75),
                        0 0 40px rgba(99, 102, 241, 0.08);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Header UI */
        .hub-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 50px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse-dot 2s infinite alternate;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        h1#repo-title {
            color: var(--text-bright);
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hub-subtitle {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 460px;
        }

        .materia-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 28px 0;
            font-style: italic;
        }

        /* Tarjeta de la Materia */
        .materia-card {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .materia-header-btn {
            width: 100%;
            background: none;
            border: none;
            padding: 18px 22px;
            color: var(--text-bright);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s ease;
        }

        .materia-header-btn:hover {
            background: var(--item-hover);
        }

        .materia-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .materia-icon {
            font-size: 1.3rem;
            transition: transform 0.25s ease;
        }

        .materia-title {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.2px;
            color: #ffffff;
        }

        .materia-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .count-badge {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 3px 9px;
            border-radius: 8px;
            border: 1px solid rgba(129, 140, 248, 0.2);
        }

        .chevron-icon {
            color: var(--text-muted);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .materia-card.open {
            border-color: var(--border-hover);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(99, 102, 241, 0.12);
        }

        .materia-card.open .chevron-icon {
            transform: rotate(180deg);
            color: var(--primary);
        }

        .materia-card.open .materia-icon {
            transform: scale(1.15);
        }

        .tp-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(10, 13, 20, 0.5);
            border-top: 1px solid transparent;
        }

        .materia-card.open .tp-wrapper {
            border-top-color: var(--border-color);
        }

        .tp-list {
            padding: 14px 18px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tp-btn {
            background: var(--tp-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .tp-btn:hover {
            background: #1e1b4b;
            border-color: var(--primary);
            color: #ffffff;
            transform: translateX(4px);
        }

        .tp-badge {
            font-size: 0.78rem;
            color: #818cf8;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .fixed-badge {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(15, 19, 29, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6), 
                        0 0 20px rgba(99, 102, 241, 0.15);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
        }

        .fixed-badge:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(129, 140, 248, 0.4);
            box-shadow: 0 14px 35px -5px rgba(0, 0, 0, 0.7), 
                        0 0 28px rgba(99, 102, 241, 0.3);
        }

        .gemini-text {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .author-tag {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.3));
            border: 1px solid rgba(129, 140, 248, 0.4);
            transition: all 0.25s ease;
        }

        .author-tag:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.6), rgba(168, 85, 247, 0.6));
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
            border-color: rgba(255, 255, 255, 0.6);
        }

        @media (max-width: 600px) {
            .hub-card { padding: 32px 20px; }
            h1#repo-title { font-size: 1.75rem; }
            .fixed-badge {
                bottom: 12px;
                right: 12px;
                left: 12px;
                justify-content: center;
                font-size: 0.8rem;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>

<main class="hub-container">
    <div class="hub-card">
        <header class="hub-header">
            <div class="status-pill">
                <span class="status-dot"></span>
                <span>Entorno Académico Activo</span>
            </div>
            <h1 id="repo-title">FACULTY HUB</h1>
            <p class="hub-subtitle">
                Haz clic en la carpeta de la materia para ver y acceder a sus Trabajos Prácticos:
            </p>
        </header>

        <section id="btn-container" class="materia-container">
            <span class="loading-text">🔍 Cargando materias desde GitHub...</span>
        </section>
    </div>
</main>

<div class="fixed-badge">
    <span>Desarrollado con <span class="gemini-text">Google Gemini ✨</span> por</span>
    <a href="https://github.com/enegdev" target="_blank" class="author-tag">enegdev</a>
</div>

<!-- Cargar archivo de configuración externo -->
<script src="config.js"></script>

<script>
    function obtenerNombreOficial(folderName) {
        const mapa = (typeof materiasOficiales !== 'undefined') ? materiasOficiales : {};
        return mapa[folderName] || folderName.replace(/-/g, ' ').replace(/_/g, ' ');
    }

    function formatTPTitle(tpFolder) {
        const num = tpFolder.replace(/^(trabajo-practico|tp)[-_]?/i, '');
        if (!isNaN(num) && num.trim() !== '') {
            return `Trabajo Práctico ${num}`;
        }
        return tpFolder.replace(/-/g, ' ').replace(/_/g, ' ');
    }

    async function cargarEjercicios() {
        const container = document.getElementById('btn-container');
        const titleEl = document.getElementById('repo-title');

        const hostParts = window.location.hostname.split('.');
        const pathParts = window.location.pathname.split('/').filter(Boolean);

        const isGitHubPages = window.location.hostname.endsWith('github.io');
        const USER = isGitHubPages ? hostParts[0] : "enegdev";  
        const REPO = (isGitHubPages && pathParts.length > 0) ? pathParts[0] : "Faculty_Hub";  

        titleEl.innerText = "FACULTY HUB";
        document.title = "Faculty Hub - Centro de Ejercicios";

        try {
            const resRoot = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents?t=${Date.now()}`);
            if (!resRoot.ok) throw new Error("Error consultando el repositorio");

            const rootItems = await resRoot.json();
            const materiasDirs = rootItems
                .filter(item => item.type === 'dir' && !item.name.startsWith('.'))
                .map(item => item.name);

            if (materiasDirs.length === 0) {
                container.innerHTML = '<span class="loading-text">No se encontraron carpetas de materias en el repositorio.</span>';
                return;
            }

            const materiasData = [];
            for (const carpetaMateria of materiasDirs) {
                try {
                    const resMateria = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${encodeURIComponent(carpetaMateria)}?t=${Date.now()}`);
                    if (resMateria.ok) {
                        const items = await resMateria.json();
                        const tps = items
                            .filter(item => item.type === 'dir' && !item.name.startsWith('.'))
                            .map(item => item.name)
                            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

                        materiasData.push({
                            folderName: carpetaMateria,
                            displayName: obtenerNombreOficial(carpetaMateria),
                            tps: tps
                        });
                    }
                } catch (err) {
                    console.error("Error al cargar TPs de " + carpetaMateria, err);
                }
            }

            if (materiasData.length > 0) {
                localStorage.setItem('cache_materias_data', JSON.stringify(materiasData));
                renderizarMaterias(materiasData);
            } else {
                container.innerHTML = '<span class="loading-text">No se encontraron Trabajos Prácticos.</span>';
            }

        } catch (e) {
            const cache = localStorage.getItem('cache_materias_data');
            if (cache) {
                renderizarMaterias(JSON.parse(cache));
            } else {
                container.innerHTML = '<span class="loading-text">No se pudieron obtener los datos desde GitHub API.</span>';
            }
        }

        function renderizarMaterias(listaMaterias) {
            container.innerHTML = listaMaterias.map((materia, idx) => `
                <div class="materia-card" id="card-${idx}">
                    <button class="materia-header-btn" onclick="toggleMateria(${idx})">
                        <div class="materia-info">
                            <span class="materia-icon">📁</span>
                            <span class="materia-title">${materia.displayName}</span>
                        </div>
                        <div class="materia-meta">
                            <span class="count-badge">${materia.tps.length} TP(s)</span>
                            <svg class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </button>
                    <div class="tp-wrapper" id="wrapper-${idx}">
                        <div class="tp-list">
                            ${materia.tps.map(tp => `
                                <a href="./${encodeURIComponent(materia.folderName)}/${encodeURIComponent(tp)}/" class="tp-btn">
                                    <span>📄 ${formatTPTitle(tp)}</span>
                                    <span class="tp-badge">Abrir ↗</span>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }
    }

    function toggleMateria(index) {
        const card = document.getElementById(`card-${index}`);
        const wrapper = document.getElementById(`wrapper-${index}`);
        const isOpen = card.classList.contains('open');

        document.querySelectorAll('.materia-card').forEach((c, i) => {
            c.classList.remove('open');
            document.getElementById(`wrapper-${i}`).style.maxHeight = null;
        });

        if (!isOpen) {
            card.classList.add('open');
            wrapper.style.maxHeight = wrapper.scrollHeight + "px";
        }
    }

    document.addEventListener('DOMContentLoaded', cargarEjercicios);
</script>

</body>
</html>
