<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Ejercicios</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0f1117;
            color: #cbd5e1;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .hub-card {
            background: #181b24;
            border: 1px solid #2e3447;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .header-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: inline-block;
        }

        h1 {
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loading-text {
            color: #64748b;
            font-size: 0.9rem;
            font-style: italic;
        }

        .exercise-btn {
            background: #212532;
            border: 1px solid #2e3447;
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.98rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .exercise-btn:hover {
            background: #6366f1;
            border-color: #818cf8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.25);
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="hub-card">
    <div class="header-icon">🚀</div>
    <h1>Studio Ejercicios</h1>
    <p>Elige un ejercicio de la guía para visualizar:</p>
    
    <div id="btn-container" class="btn-container">
        <!-- Sin nombres viejos hardcodeados -->
        <span class="loading-text">Cargando ejercicios...</span>
    </div>
</div>

<script>
    async function cargarEjercicios() {
        const container = document.getElementById('btn-container');

        const hostParts = window.location.hostname.split('.');
        const pathParts = window.location.pathname.split('/').filter(Boolean);

        const USER = hostParts[0];  
        const REPO = pathParts[0];  

        if (!window.location.hostname.endsWith('github.io') || !USER || !REPO) {
            const cache = localStorage.getItem('cache_carpetas');
            if (cache) renderizar(JSON.parse(cache));
            else container.innerHTML = '<span class="loading-text">Detección no disponible fuera de GitHub Pages</span>';
            return;
        }

        try {
            // ?t=${Date.now()} evita que el navegador guarde en caché respuestas viejas de la API
            const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents?t=${Date.now()}`);
            if (!res.ok) throw new Error("Límite de API alcanzado o error de red");

            const data = await res.json();
            
            const carpetas = data
                .filter(item => item.type === 'dir' && !item.name.startsWith('.'))
                .map(item => item.name)
                .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

            if (carpetas.length > 0) {
                localStorage.setItem('cache_carpetas', JSON.stringify(carpetas));
                renderizar(carpetas);
            }
        } catch (e) {
            const cache = localStorage.getItem('cache_carpetas');
            if (cache) {
                renderizar(JSON.parse(cache));
            } else {
                container.innerHTML = '<span class="loading-text">No se pudieron cargar los ejercicios.</span>';
            }
        }

        function renderizar(lista) {
            container.innerHTML = lista.map(nombre => `
                <a href="./${nombre}/" class="exercise-btn">
                    <span>📁 ${nombre}</span>
                    <span class="badge">Abrir ↗</span>
                </a>
            `).join('');
        }
    }

    cargarEjercicios();
</script>

</body>
</html>
